<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="calendar-token" content="__CALENDAR_TOKEN__">
  <title>定时任务日历 · Codex</title><link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <a class="brand" href="/" aria-label="定时任务日历首页" data-i18n-aria="定时任务日历首页"><span class="brand-icon">▦</span><span><span data-i18n="日历">日历</span><span class="brand-caption">FOR CODEX</span></span></a>
    <div class="sidebar-heading"><span data-i18n="工作空间">工作空间</span></div>
    <button class="nav-item selected" id="calendar-nav"><span>▦</span><span data-i18n="定时任务日历">定时任务日历</span></button>
    <div class="mini-top"><strong id="mini-title"></strong><div><button id="mini-prev" aria-label="迷你日历上个月" data-i18n-aria="迷你日历上个月">‹</button><button id="mini-next" aria-label="迷你日历下个月" data-i18n-aria="迷你日历下个月">›</button></div></div>
    <div class="mini-week"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
    <div id="mini-grid" class="mini-grid"></div>
    <div class="sidebar-heading spaced"><span data-i18n="任务状态">任务状态</span></div>
    <div class="filters" id="filters">
      <button data-filter="ACTIVE" class="filter selected"><span class="dot green"></span><span data-i18n="已开启">已开启</span><span id="active-count" class="count">—</span></button>
      <button data-filter="PAUSED" class="filter"><span class="dot gray"></span><span data-i18n="已暂停">已暂停</span><span id="paused-count" class="count">—</span></button>
      <button data-filter="COMPLETED" class="filter"><span class="dot purple"></span><span data-i18n="已完成">已完成</span><span id="completed-count" class="count">—</span></button>
      <button data-filter="ALL" class="filter"><span class="dot outline"></span><span data-i18n="全部任务">全部任务</span><span id="all-count" class="count">—</span></button>
    </div>
    <div class="source-card"><span class="source-led"></span><strong><span data-i18n="本地任务已连接">本地任务已连接</span></strong><p id="source-text"><span data-i18n="正在读取任务…">正在读取任务…</span></p><span class="source-note"><span data-i18n="云端任务尚未接入">云端任务尚未接入</span></span></div>
    <div class="sidebar-bottom"><span data-i18n="一个更清楚的时间视角">一个更清楚的时间视角</span><span>Scheduled Calendar · 0.1</span></div>
  </aside>
  <main>
    <header class="page-header"><div><div class="eyebrow">YOUR AGENTS, ON SCHEDULE</div><h1><span data-i18n="让每一项安排，一目了然">让每一项安排，一目了然</span><span class="title-dot">.</span></h1><p><span data-i18n="把任务交给 Codex，把时间留给自己。">把任务交给 Codex，把时间留给自己。</span></p></div><div class="header-actions"><select id="language" aria-label="Language" data-i18n-aria="语言"><option value="auto" data-i18n="跟随浏览器">跟随浏览器</option><option value="en">English</option><option value="zh-CN">简体中文</option></select><button id="refresh" class="button refresh">↻ <span><span data-i18n="刷新">刷新</span></span></button></div></header>
    <section class="overview" aria-label="安排概览" data-i18n-aria="安排概览">
      <div><span class="metric-label"><span data-i18n="今日计划">今日计划</span></span><strong id="today-count">—</strong><small><span data-i18n="次计划触发">次计划触发</span></small></div>
      <div><span class="metric-label"><span data-i18n="本周安排">本周安排</span></span><strong id="week-count">—</strong><small><span data-i18n="次计划触发">次计划触发</span></small></div>
      <div class="next-metric"><span class="metric-label"><span data-i18n="下一项任务">下一项任务</span></span><strong id="next-title"><span data-i18n="正在读取…">正在读取…</span></strong><small id="next-time">—</small></div>
    </section>
    <div id="notice" role="status" class="notice" hidden></div>
    <section class="calendar-shell">
      <div class="toolbar"><div class="date-controls"><h2 id="range-title"></h2><span id="week-number" class="week-number"></span><button id="prev" class="icon-button" aria-label="上一期" data-i18n-aria="上一期">‹</button><button id="next" class="icon-button" aria-label="下一期" data-i18n-aria="下一期">›</button><button id="today" class="button today-button"><span data-i18n="今天">今天</span></button></div><div class="view-switch" aria-label="日历视图" data-i18n-aria="日历视图"><button data-view="week" class="selected"><span data-i18n="周">周</span></button><button data-view="month"><span data-i18n="月">月</span></button><button data-view="agenda"><span data-i18n="日程">日程</span></button></div></div>
      <div class="sub-toolbar"><label class="search"><span>⌕</span><input id="search" placeholder="搜索任务…" data-i18n-placeholder="搜索任务…" aria-label="搜索任务" data-i18n-aria="搜索任务"></label><select id="mobile-filter" aria-label="任务状态" data-i18n-aria="任务状态"><option value="ACTIVE" data-i18n="已开启">已开启</option><option value="PAUSED" data-i18n="已暂停">已暂停</option><option value="COMPLETED" data-i18n="已完成">已完成</option><option value="ALL" data-i18n="全部任务">全部任务</option></select><span id="zone" class="zone"></span></div>
      <div id="monitor-lane" class="monitor-lane" hidden></div>
      <div id="calendar" class="calendar" aria-live="polite"><div class="loading"><span data-i18n="正在读取你的安排…">正在读取你的安排…</span></div></div>
      <footer class="calendar-footer"><span><span data-i18n="● 调度器下一次　○ 周期预估">● 调度器下一次　○ 周期预估</span></span><span class="coverage-label"><span data-i18n="仅本机 · 云端尚未接入">仅本机 · 云端尚未接入</span></span><span id="sync-time"><span data-i18n="等待同步">等待同步</span></span></footer>
    </section>
    <p class="fine-print"><span data-i18n="日历展示触发时间，不代表任务耗时。周期预估与历史日期不等于执行记录。">日历展示触发时间，不代表任务耗时。周期预估与历史日期不等于执行记录。</span></p>
  </main>
</div>
<dialog id="details"><button id="close-details" class="close-button" aria-label="关闭详情" data-i18n-aria="关闭详情">×</button><div id="details-content"></div></dialog>
<script src="/i18n.js" defer></script>
<script src="/app.js" defer></script>
</body></html>
